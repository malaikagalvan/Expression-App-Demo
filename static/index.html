<!DOCTYPE html>
<html>
<head>
    <title>Emotion AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Emotion AI</h1>

    <!-- File Upload Section -->
    <p class="small-text">Which image do you want to classify?</p>
    <div class="upload">
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="uploadImage()">Classify Image</button>
    </div>
    

    <hr>

    <!-- Results Section -->
    <h2>Results:</h2>
    <p class="input" id="predictionText">Prediction: </p>
    <pre class="output" id="confidenceText">Confidence: </pre>

    <script>
        async function uploadImage() {
            const input = document.getElementById('imageInput');
            if (input.files.length === 0) {
                alert("Please select an image first!");
                return;
            }

            const formData = new FormData();
            formData.append("file", input.files[0]);

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Display results on screen
                document.getElementById('predictionText').innerText = "Prediction: " + data.prediction;
                document.getElementById('confidenceText').innerText = JSON.stringify(data.confidence, null, 2);
            } catch (error) {
                alert("Error connecting to backend server!");
            }
        }
    </script>
</body>
</html>
